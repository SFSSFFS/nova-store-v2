<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | NOVA STORE</title>
    <meta name="description" content="Browse the NOVA collection: women, men and accessories. Delivery in Kigali and across Rwanda.">
    <meta name="theme-color" content="#171717">
    <meta property="og:title" content="Shop | NOVA STORE">
    <meta property="og:description" content="Browse the NOVA collection: women, men and accessories. Delivery in Kigali and across Rwanda.">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/shop.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body data-page="shop">

    <div id="site-header"></div>

    <main id="main">

        <section class="shop-intro">
            <p class="eyebrow" data-i18n="shop.eyebrow">THE COLLECTION</p>
            <h1 data-i18n="shop.title">Shop All</h1>
            <p data-i18n="shop.sub">Timeless pieces for every day.</p>
        </section>

        <section class="shop-container">
            <div class="shop-toolbar">
                <p class="shop-results" id="shop-results" aria-live="polite"></p>

                <div class="shop-controls">
                    <input type="search" id="shop-search" placeholder="Search products" data-i18n-placeholder="shop.search" aria-label="Search products">

                    <select id="shop-category" aria-label="Category">
                        <option value="all" data-i18n="cat.all">All Categories</option>
                        <option value="women" data-i18n="cat.women">Women</option>
                        <option value="men" data-i18n="cat.men">Men</option>
                        <option value="accessories" data-i18n="cat.accessories">Accessories</option>
                    </select>

                    <select id="shop-sort" aria-label="Sort">
                        <option value="default" data-i18n="sort.default">Sort: Featured</option>
                        <option value="low" data-i18n="sort.low">Price: Low to High</option>
                        <option value="high" data-i18n="sort.high">Price: High to Low</option>
                        <option value="name" data-i18n="sort.name">Name: A to Z</option>
                    </select>
                </div>
            </div>

            <div class="shop-product-grid" id="shop-grid"></div>
        </section>

    </main>

    <div id="site-footer"></div>

    <script src="js/config.js" defer></script>
    <script src="js/lang/en.js" defer></script>
    <script src="js/lang/rw.js" defer></script>
    <script src="js/i18n.js" defer></script>
    <script src="js/products.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="js/components.js" defer></script>
    <script src="js/shop.js" defer></script>
</body>
</html>
