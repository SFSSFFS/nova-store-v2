<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | NOVA STORE</title>
    <meta name="description" content="Secure checkout with MTN Mobile Money, Airtel Money or cash on delivery.">
    <meta name="theme-color" content="#171717">
    <meta name="robots" content="noindex">
    <meta property="og:title" content="Checkout | NOVA STORE">
    <meta property="og:description" content="Secure checkout with MTN Mobile Money, Airtel Money or cash on delivery.">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cart.css">
    <link rel="stylesheet" href="css/checkout.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body data-page="checkout">

    <div id="site-header"></div>

    <main id="main" class="checkout-page">

        <div class="checkout-heading">
            <h1 data-i18n="checkout.title">Checkout</h1>
            <p data-i18n="checkout.sub">Complete your order in a few simple steps.</p>
        </div>

        <div class="checkout-container">

            <section class="checkout-form-section">
                <form id="checkout-form" novalidate>

                    <h2 data-i18n="sec.contact">Contact Information</h2>

                    <div class="form-group">
                        <label for="customer-name" data-i18n="f.name">Full Name</label>
                        <input type="text" id="customer-name" autocomplete="name" placeholder="Your full name" data-i18n-placeholder="f.name.ph">
                        <small class="field-error" id="error-customer-name"></small>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="customer-phone" data-i18n="f.phone">Phone Number</label>
                            <input type="tel" id="customer-phone" inputmode="tel" autocomplete="tel" placeholder="078 123 4567" data-i18n-placeholder="f.phone.ph">
                            <small class="field-help" data-i18n="f.phone.help">Our courier will call this number.</small>
                            <small class="field-error" id="error-customer-phone"></small>
                        </div>

                        <div class="form-group">
                            <label for="customer-email" data-i18n="f.email">Email (optional)</label>
                            <input type="email" id="customer-email" autocomplete="email" placeholder="you@example.com" data-i18n-placeholder="f.email.ph">
                            <small class="field-error" id="error-customer-email"></small>
                        </div>
                    </div>

                    <h2 data-i18n="sec.address">Delivery Address</h2>

                    <div class="form-group">
                        <label for="delivery-area" data-i18n="f.area">Delivery Area</label>
                        <select id="delivery-area"></select>
                        <small class="field-error" id="error-delivery-area"></small>
                    </div>

                    <div class="form-group">
                        <label for="customer-address" data-i18n="f.address">Sector, Neighborhood and Street</label>
                        <input type="text" id="customer-address" autocomplete="street-address" placeholder="e.g. Kimironko, KG 11 Ave" data-i18n-placeholder="f.address.ph">
                        <small class="field-error" id="error-customer-address"></small>
                    </div>

                    <div class="form-group">
                        <label for="customer-notes" data-i18n="f.notes">Delivery Notes (optional)</label>
                        <textarea id="customer-notes" rows="2" placeholder="Landmark, building name or gate colour" data-i18n-placeholder="f.notes.ph"></textarea>
                    </div>

                    <h2 data-i18n="sec.delivery">Delivery Method</h2>

                    <div class="delivery-option">
                        <label>
                            <input type="radio" name="delivery" value="standard" checked>
                            <span class="option-name" data-i18n="del.standard">Standard Delivery</span>
                            <span id="price-standard"></span>
                        </label>
                    </div>

                    <div class="delivery-option">
                        <label>
                            <input type="radio" name="delivery" value="express">
                            <span class="option-name" data-i18n="del.express">Express Delivery</span>
                            <span id="price-express"></span>
                        </label>
                    </div>

                    <h2 data-i18n="sec.payment">Payment Method</h2>

                    <div class="delivery-option">
                        <label>
                            <input type="radio" name="payment" value="momo" checked>
                            <div class="option-text"><b data-i18n="pay.momo">MTN Mobile Money</b><small class="option-desc" data-i18n="pay.momo.desc">Approve the payment request on your phone</small></div>
                        </label>
                    </div>

                    <div class="delivery-option">
                        <label>
                            <input type="radio" name="payment" value="airtel">
                            <div class="option-text"><b data-i18n="pay.airtel">Airtel Money</b><small class="option-desc" data-i18n="pay.airtel.desc">Approve the payment request on your phone</small></div>
                        </label>
                    </div>

                    <div class="delivery-option">
                        <label>
                            <input type="radio" name="payment" value="cod">
                            <div class="option-text"><b data-i18n="pay.cod">Cash on Delivery</b><small class="option-desc" data-i18n="pay.cod.desc">Pay the courier when your order arrives</small></div>
                        </label>
                    </div>

                    <div class="form-group" id="pay-phone-group">
                        <label for="pay-phone" data-i18n="f.paynumber">Mobile Money Number (optional)</label>
                        <input type="tel" id="pay-phone" inputmode="tel" placeholder="Leave empty to use your phone number" data-i18n-placeholder="f.paynumber.ph">
                        <small class="field-error" id="error-pay-phone"></small>
                    </div>

                    <button type="submit" class="checkout-btn" data-i18n="btn.place">Place Order</button>

                </form>
            </section>

            <aside class="checkout-summary">
                <h2 data-i18n="checkout.summary">Your Order</h2>
                <div id="checkout-items"></div>
                <div id="checkout-totals"></div>
            </aside>

        </div>

    </main>

    <div id="site-footer"></div>

    <script src="js/config.js" defer></script>
    <script src="js/lang/en.js" defer></script>
    <script src="js/lang/rw.js" defer></script>
    <script src="js/i18n.js" defer></script>
    <script src="js/products.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="js/components.js" defer></script>
    <script src="js/payment.js" defer></script>
    <script src="js/checkout.js" defer></script>
</body>
</html>
