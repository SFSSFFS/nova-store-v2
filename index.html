<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA STORE | Modern Elegance</title>
    <meta name="description" content="NOVA — timeless fashion and accessories, delivered across Rwanda. Pay with MTN Mobile Money, Airtel Money or cash on delivery.">
    <meta name="theme-color" content="#171717">
    <meta property="og:title" content="NOVA STORE | Modern Elegance">
    <meta property="og:description" content="NOVA — timeless fashion and accessories, delivered across Rwanda. Pay with MTN Mobile Money, Airtel Money or cash on delivery.">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body data-page="home">

    <div id="site-header"></div>

    <main id="main">

        <section class="hero">
            <div class="hero-content">
                <p class="eyebrow" data-i18n="home.eyebrow">THE NEW COLLECTION</p>
                <h1 data-i18n-html="home.title">Elegance is<br>an attitude.</h1>
                <p class="hero-description" data-i18n="home.desc">Discover timeless pieces designed for modern living.</p>
                <a href="shop.html" class="hero-button" data-i18n="home.cta">EXPLORE COLLECTION</a>
            </div>
        </section>

        <section class="categories">
            <div class="section-heading">
                <p class="eyebrow" data-i18n="home.cat.eyebrow">CURATED FOR YOU</p>
                <h2 data-i18n="home.cat.title">Explore Our World</h2>
            </div>

            <div class="category-grid">
                <a href="shop.html?category=women" class="category-card"><span data-i18n="home.cat.women">WOMEN</span></a>
                <a href="shop.html?category=men" class="category-card"><span data-i18n="home.cat.men">MEN</span></a>
                <a href="shop.html?category=accessories" class="category-card"><span data-i18n="home.cat.accessories">ACCESSORIES</span></a>
            </div>
        </section>

        <section class="featured-products">
            <div class="section-heading">
                <p class="eyebrow" data-i18n="home.featured.eyebrow">FEATURED</p>
                <h2 data-i18n="home.featured.title">Selected Pieces</h2>
                <p data-i18n="home.featured.sub">A careful edit of what we love right now.</p>
            </div>

            <div class="product-grid" id="featured-grid"></div>

            <div class="view-all">
                <a href="shop.html" data-i18n="home.viewall">VIEW ALL PRODUCTS</a>
            </div>
        </section>

    </main>

    <div id="site-footer"></div>

    <script src="js/config.js" defer></script>
    <script src="js/lang/en.js" defer></script>
    <script src="js/lang/rw.js" defer></script>
    <script src="js/i18n.js" defer></script>
    <script src="js/products.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="js/components.js" defer></script>
    <script src="js/home.js" defer></script>
</body>
</html>
